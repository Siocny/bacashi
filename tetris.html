<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            display: flex;
            gap: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .game-board {
            position: relative;
        }

        #tetris {
            border: 3px solid #4a9eff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 150px;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .panel-box h3 {
            color: #4a9eff;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-box p {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        #next-piece {
            border: 2px solid #4a9eff;
            border-radius: 5px;
            margin: 0 auto;
            display: block;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .controls h3 {
            color: #4a9eff;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .controls p {
            color: #ccc;
            font-size: 12px;
            margin: 5px 0;
        }

        .controls span {
            color: #4a9eff;
            font-weight: bold;
        }

        #start-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            color: #1a1a2e;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #start-btn:hover {
            background: #6ab2ff;
            transform: translateY(-2px);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        .game-over h2 {
            color: #ff4a4a;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .game-over p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .game-over button {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <canvas id="tetris" width="300" height="600"></canvas>
            <div class="game-over" id="game-over">
                <h2>游戏结束</h2>
                <p>得分：<span id="final-score">0</span></p>
                <button onclick="resetGame()">重新开始</button>
            </div>
        </div>
        <div class="side-panel">
            <div class="panel-box">
                <h3>得分</h3>
                <p id="score">0</p>
            </div>
            <div class="panel-box">
                <h3>等级</h3>
                <p id="level">1</p>
            </div>
            <div class="panel-box">
                <h3>消除行数</h3>
                <p id="lines">0</p>
            </div>
            <div class="panel-box">
                <h3>下一个</h3>
                <canvas id="next-piece" width="100" height="100"></canvas>
            </div>
            <div class="controls">
                <h3>操作</h3>
                <p><span>←→</span> 左右移动</p>
                <p><span>↑</span> 旋转</p>
                <p><span>↓</span> 加速下落</p>
                <p><span>空格</span> 直接掉落</p>
                <p><span>P</span> 暂停</p>
            </div>
            <button id="start-btn" onclick="toggleGame()">开始游戏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const NEXT_BLOCK_SIZE = 20;

        // 方块形状定义
        const SHAPES = {
            I: [[1, 1, 1, 1]],
            O: [[1, 1], [1, 1]],
            T: [[0, 1, 0], [1, 1, 1]],
            S: [[0, 1, 1], [1, 1, 0]],
            Z: [[1, 1, 0], [0, 1, 1]],
            J: [[1, 0, 0], [1, 1, 1]],
            L: [[0, 0, 1], [1, 1, 1]]
        };

        // 方块颜色
        const COLORS = {
            I: '#00f5ff',
            O: '#ffeb3b',
            T: '#9c27b0',
            S: '#4caf50',
            Z: '#f44336',
            J: '#2196f3',
            L: '#ff9800'
        };

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let dropInterval = 1000;
        let lastDrop = 0;
        let animationId = null;

        // 初始化游戏板
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = null;
                }
            }
        }

        // 方块类
        class Piece {
            constructor(type) {
                this.type = type;
                this.shape = SHAPES[type].map(row => [...row]);
                this.color = COLORS[type];
                this.x = Math.floor((COLS - this.shape[0].length) / 2);
                this.y = 0;
            }

            rotate() {
                const rows = this.shape.length;
                const cols = this.shape[0].length;
                const rotated = [];
                for (let c = 0; c < cols; c++) {
                    rotated[c] = [];
                    for (let r = rows - 1; r >= 0; r--) {
                        rotated[c].push(this.shape[r][c]);
                    }
                }
                return rotated;
            }
        }

        // 随机生成方块
        function randomPiece() {
            const types = Object.keys(SHAPES);
            const type = types[Math.floor(Math.random() * types.length)];
            return new Piece(type);
        }

        // 绘制方块
        function drawBlock(context, x, y, color, size) {
            const gradient = context.createLinearGradient(x, y, x + size, y + size);
            gradient.addColorStop(0, color);
            gradient.addColorStop(1, shadeColor(color, -20));

            context.fillStyle = gradient;
            context.fillRect(x + 1, y + 1, size - 2, size - 2);

            // 高光效果
            context.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            context.lineWidth = 2;
            context.strokeRect(x + 3, y + 3, size - 6, size - 6);
        }

        // 颜色变暗/变亮
        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x000000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // 绘制游戏板
        function drawBoard() {
            // 背景
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格线
            ctx.strokeStyle = 'rgba(74, 158, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            }

            // 已放置的方块
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, board[r][c], BLOCK_SIZE);
                    }
                }
            }
        }

        // 绘制当前方块
        function drawPiece(piece) {
            if (!piece) return;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        drawBlock(ctx,
                            (piece.x + c) * BLOCK_SIZE,
                            (piece.y + r) * BLOCK_SIZE,
                            piece.color,
                            BLOCK_SIZE);
                    }
                }
            }
        }

        // 绘制幽灵方块（预测落点）
        function drawGhost() {
            if (!currentPiece) return;
            let ghostY = currentPiece.y;
            while (!collision(currentPiece.x, ghostY + 1, currentPiece.shape)) {
                ghostY++;
            }

            ctx.globalAlpha = 0.3;
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        drawBlock(ctx,
                            (currentPiece.x + c) * BLOCK_SIZE,
                            (ghostY + r) * BLOCK_SIZE,
                            currentPiece.color,
                            BLOCK_SIZE);
                    }
                }
            }
            ctx.globalAlpha = 1;
        }

        // 绘制下一个方块
        function drawNextPiece() {
            nextCtx.fillStyle = '#0a0a1a';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!nextPiece) return;

            const offsetX = (nextCanvas.width - nextPiece.shape[0].length * NEXT_BLOCK_SIZE) / 2;
            const offsetY = (nextCanvas.height - nextPiece.shape.length * NEXT_BLOCK_SIZE) / 2;

            for (let r = 0; r < nextPiece.shape.length; r++) {
                for (let c = 0; c < nextPiece.shape[r].length; c++) {
                    if (nextPiece.shape[r][c]) {
                        drawBlock(nextCtx,
                            offsetX + c * NEXT_BLOCK_SIZE,
                            offsetY + r * NEXT_BLOCK_SIZE,
                            nextPiece.color,
                            NEXT_BLOCK_SIZE);
                    }
                }
            }
        }

        // 碰撞检测
        function collision(x, y, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        const newX = x + c;
                        const newY = y + r;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // 放置方块
        function placePiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const boardY = currentPiece.y + r;
                        if (boardY >= 0) {
                            board[boardY][currentPiece.x + c] = currentPiece.color;
                        }
                    }
                }
            }
        }

        // 消除行
        function clearLines() {
            let linesCleared = 0;

            for (let r = ROWS - 1; r >= 0; r--) {
                let full = true;
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c]) {
                        full = false;
                        break;
                    }
                }

                if (full) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(null));
                    linesCleared++;
                    r++;
                }
            }

            if (linesCleared > 0) {
                // 计分规则
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                lines += linesCleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);

                updateDisplay();
            }
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        // 移动方块
        function movePiece(dir) {
            if (!collision(currentPiece.x + dir, currentPiece.y, currentPiece.shape)) {
                currentPiece.x += dir;
            }
        }

        // 旋转方块
        function rotatePiece() {
            const rotated = currentPiece.rotate();
            if (!collision(currentPiece.x, currentPiece.y, rotated)) {
                currentPiece.shape = rotated;
            } else if (!collision(currentPiece.x - 1, currentPiece.y, rotated)) {
                currentPiece.x -= 1;
                currentPiece.shape = rotated;
            } else if (!collision(currentPiece.x + 1, currentPiece.y, rotated)) {
                currentPiece.x += 1;
                currentPiece.shape = rotated;
            }
        }

        // 下落方块
        function dropPiece() {
            if (!collision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
                return true;
            }
            return false;
        }

        // 硬掉落
        function hardDrop() {
            while (dropPiece()) {
                score += 2;
            }
            lockPiece();
        }

        // 锁定方块
        function lockPiece() {
            placePiece();
            clearLines();
            currentPiece = nextPiece;
            nextPiece = randomPiece();
            drawNextPiece();

            if (collision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                gameOver();
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('start-btn').textContent = '开始游戏';
            cancelAnimationFrame(animationId);
        }

        // 游戏主循环
        function gameLoop(timestamp) {
            if (!gameRunning || gamePaused) return;

            if (timestamp - lastDrop > dropInterval) {
                if (!dropPiece()) {
                    lockPiece();
                }
                lastDrop = timestamp;
            }

            drawBoard();
            drawGhost();
            drawPiece(currentPiece);

            animationId = requestAnimationFrame(gameLoop);
        }

        // 切换游戏状态
        function toggleGame() {
            if (gameRunning) {
                gamePaused = !gamePaused;
                if (!gamePaused) {
                    lastDrop = performance.now();
                    gameLoop(lastDrop);
                }
                document.getElementById('start-btn').textContent = gamePaused ? '继续' : '暂停';
            } else {
                startGame();
            }
        }

        // 开始游戏
        function startGame() {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            updateDisplay();

            currentPiece = randomPiece();
            nextPiece = randomPiece();
            drawNextPiece();

            gameRunning = true;
            gamePaused = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-btn').textContent = '暂停';

            lastDrop = performance.now();
            gameLoop(lastDrop);
        }

        // 重置游戏
        function resetGame() {
            document.getElementById('game-over').style.display = 'none';
            startGame();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused) {
                if (e.key === 'p' || e.key === 'P') {
                    toggleGame();
                }
                return;
            }

            switch(e.key) {
                case 'ArrowLeft':
                    movePiece(-1);
                    break;
                case 'ArrowRight':
                    movePiece(1);
                    break;
                case 'ArrowDown':
                    if (dropPiece()) score += 1;
                    updateDisplay();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    hardDrop();
                    break;
                case 'p':
                case 'P':
                    toggleGame();
                    return;
            }

            if (gameRunning && !gamePaused) {
                drawBoard();
                drawGhost();
                drawPiece(currentPiece);
            }
        });

        // 初始绘制
        initBoard();
        drawBoard();
        drawNextPiece();
    </script>
</body>
</html>
