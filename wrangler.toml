name = "cafele-brand"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages 配置
pages_build_output_dir = "./brand-website"

[env.production]
# 可在 Cloudflare Pages 后台设置以下环境变量：
# COS_BUCKET - COS 存储桶名称
# COS_REGION - COS 地域
# COS_SECRET_ID - COS 密钥 ID
# COS_SECRET_KEY - COS 密钥 Key
